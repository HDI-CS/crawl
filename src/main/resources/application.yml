spring:
  profiles:
    include: local, storage

  datasource:
    url: jdbc:postgresql://${POSTGRESQL_HOST}:${POSTGRESQL_PORT}/${POSTGRESQL_DATABASE}
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      ssl:
        # docker-compose.yml의 redis 컨테이너(redis:alpine)는 TLS 없이 뜬다.
        # 운영 배포(be_deploy.yml)도 이 docker-compose로 나가므로 기본값은 false.
        # TLS 종료가 되는 redis(ElastiCache 등)로 옮기면 REDIS_SSL_ENABLED=true로 설정.
        enabled: ${REDIS_SSL_ENABLED:false}

  session:
    store-type: redis
    timeout: 2h
    redis:
      namespace: hdi:session

  servlet:
    session:
      timeout: 2h
      cookie:
        max-age: 7200

server:
  compression:
    enabled: true
    mime-types: text/html,text/plain,application/json
    min-response-size: 1024
  tomcat:
    threads:
      max: 60

aws:
  s3:
    accessKey: ${S3_ACCESS_KEY}
    secretKey: ${S3_SECRET_KEY}
    region: ${S3_REGION}
    bucket: ${S3_BUCKET}

etc:
  base-url: ${BASE_URL}
  local-image-path: /Users/leo/workspace/hdi_images

crypto:
  password-key: ${CRYPTO_PASSWORD}

springdoc:
  swagger-ui:
    path: /swagger

